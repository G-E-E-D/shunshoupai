plugins {
    id 'com.android.application'
}

def signingValues = [
    path: System.getenv('ANDROID_KEYSTORE_PATH'),
    storePassword: System.getenv('ANDROID_KEYSTORE_PASSWORD'),
    alias: System.getenv('ANDROID_KEY_ALIAS'),
    keyPassword: System.getenv('ANDROID_KEY_PASSWORD')
]
def hasSigning = signingValues.values().every { it != null && !it.isEmpty() }
def packagingRelease = gradle.startParameter.taskNames.any {
    it.toLowerCase().matches('.*(assemble|bundle|package).*release.*')
}
if (packagingRelease && !hasSigning) {
    throw new GradleException('Release signing requires ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD. Use assembleDebug for local development.')
}

android {
    namespace 'com.shunshoupai.app'
    compileSdk 36
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'com.shunshoupai.app'
        minSdk 26
        targetSdk 36
        versionCode 10
        versionName '2.2.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }

    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(signingValues.path)
                storePassword signingValues.storePassword
                keyAlias signingValues.alias
                keyPassword signingValues.keyPassword
                storeType 'PKCS12'
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            debuggable false
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        animationsDisabled true
    }
    lint {
        abortOnError true
        checkReleaseBuilds true
    }
}

def releaseMetadata = [
    application_id: android.defaultConfig.applicationId,
    version_name: android.defaultConfig.versionName,
    version_code: android.defaultConfig.versionCode,
    apk_name: "shunshoupai-android-v${android.defaultConfig.versionName}.apk".toString(),
    artifact_name: "shunshoupai-android-release-v${android.defaultConfig.versionName}".toString(),
    build_tools_version: android.buildToolsVersion
]
tasks.register('writeReleaseMetadata') {
    description = 'Exports the application version and release asset names for CI.'
    def destination = layout.buildDirectory.file('release-metadata.json')
    inputs.properties(releaseMetadata)
    outputs.file(destination)
    doLast {
        if (!(releaseMetadata.version_name ==~ /\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?/)) {
            throw new GradleException('versionName must be a release-safe semantic version.')
        }
        def file = destination.get().asFile
        file.parentFile.mkdirs()
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(releaseMetadata)) + '\n'
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.11.0'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
}
