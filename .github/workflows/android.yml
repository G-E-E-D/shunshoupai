name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      signed: ${{ steps.package.outputs.signed }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify wrapper and Android toolchain
        run: |
          echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          chmod +x gradlew
          ./gradlew --version
      - name: Compile debug application and instrumentation tests, run Android lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shunshoupai-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/shunshoupai-release.p12" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
      - name: Verify signature and package release assets
        id: package
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk release/shunshoupai-android-v1.3.0.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs release/shunshoupai-android-v1.3.0.apk | tee release/signing-cert.txt
          cd release
          sha256sum shunshoupai-android-v1.3.0.apk > SHA256SUMS.txt
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: shunshoupai-android-release-v1.3.0
          path: android/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-build-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/shunshoupai-release.p12"

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: gradle/actions/setup-gradle@v6
      - name: Prepare live application backend
        working-directory: .
        run: |
          npm ci
          npm run build
      - name: Start isolated live backend for Android WebView tests
        working-directory: .
        env:
          APP_STORAGE: local
          APP_DB_PATH: ${{ runner.temp }}/android-test.sqlite
          AI_API_KEY: ''
          COOKIE_SECURE: 'false'
          APP_ORIGIN: ''
        run: |
          mkdir -p android/app/build/reports/backend
          # This is the same CLI as npm start, launched directly so the recorded
          # PID belongs to the server rather than an npm/shell wrapper.
          nohup node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port 3000 > android/app/build/reports/backend/server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/android-web-server.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/auth/session > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat android/app/build/reports/backend/server.log
          echo 'The isolated application backend did not become ready.' >&2
          exit 1
      - uses: actions/download-artifact@v6
        if: needs.build.outputs.signed == 'true'
        with:
          name: shunshoupai-android-release-v1.3.0
          path: android/release
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Install and launch signed APK, then run Android UI instrumentation
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          HAS_SIGNED_RELEASE: ${{ needs.build.outputs.signed }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: bash ci/emulator-check.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-emulator-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
      - name: Stop isolated test backend
        if: always()
        working-directory: .
        run: |
          if [ -f "$RUNNER_TEMP/android-web-server.pid" ]; then
            server_pid="$(cat "$RUNNER_TEMP/android-web-server.pid")"
            if [[ "$server_pid" =~ ^[0-9]+$ ]]; then
              kill "$server_pid" 2>/dev/null || true
            fi
          fi
