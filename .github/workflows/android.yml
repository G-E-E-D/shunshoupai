name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      signed: ${{ steps.package.outputs.signed }}
      version: ${{ steps.metadata.outputs.version }}
      version_code: ${{ steps.metadata.outputs.version_code }}
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Verify wrapper and Android toolchain
        run: |
          echo '81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
          chmod +x gradlew
          ./gradlew --version
      - name: Read release version and asset names from Gradle
        id: metadata
        run: |
          ./gradlew --no-daemon :app:writeReleaseMetadata
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('app/build/release-metadata.json').read_text())
          version = metadata['version_name']
          assert version == json.loads(Path('../package.json').read_text())['version'], 'Android and backend versions must match'
          if os.environ.get('GITHUB_REF_TYPE') == 'tag':
              assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Git tag must match the Android versionName'
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in {
                  'version': version,
                  'version_code': metadata['version_code'],
                  'apk_name': metadata['apk_name'],
                  'artifact_name': metadata['artifact_name'],
              }.items():
                  output.write(f'{key}={value}\n')
          PY
      - name: Compile debug application and instrumentation tests, run Android lint
        run: ./gradlew --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest :app:lintDebug
      - name: Restore release signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/shunshoupai-release.p12"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/shunshoupai-release.p12" >> "$GITHUB_ENV"
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
      - name: Verify signature and package release assets
        id: package
        if: github.event_name != 'pull_request'
        env:
          RELEASE_APK_NAME: ${{ steps.metadata.outputs.apk_name }}
        run: |
          mkdir -p release
          cp app/build/outputs/apk/release/app-release.apk "release/$RELEASE_APK_NAME"
          cp app/build/release-metadata.json release/release-metadata.json
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "release/$RELEASE_APK_NAME" | tee release/signing-cert.txt
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -P 16 -v 4 "release/$RELEASE_APK_NAME" > release/zip-alignment.txt
          python3 ci/check-native-alignment.py "release/$RELEASE_APK_NAME" | tee release/native-alignment.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "release/$RELEASE_APK_NAME" > release/apk-metadata.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump xmltree "release/$RELEASE_APK_NAME" AndroidManifest.xml > release/manifest-metadata.txt
          if grep -Eq 'BackgroundFixtureActivity|CaptureFixtureActivity' release/manifest-metadata.txt; then
            echo 'Debug-only test activities must not be shipped in the release APK.' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json, shlex
          from pathlib import Path
          expected = json.loads(Path('release/release-metadata.json').read_text())
          badging = Path('release/apk-metadata.txt').read_text()
          package = dict(field.split('=', 1) for field in shlex.split(badging.splitlines()[0])[1:])
          assert package['name'] == expected['application_id'], 'Wrong Android application ID'
          assert package['versionName'] == expected['version_name'], 'APK versionName does not match Gradle'
          assert int(package['versionCode']) == expected['version_code'], 'APK versionCode does not match Gradle'
          assert 'application-debuggable' not in badging, 'Release APK must not be debuggable'
          PY
          cd release
          sha256sum "$RELEASE_APK_NAME" > SHA256SUMS.txt
          echo 'signed=true' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v6
        if: github.event_name != 'pull_request'
        with:
          name: ${{ steps.metadata.outputs.artifact_name }}
          path: android/release/
          if-no-files-found: error
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-build-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/shunshoupai-release.p12"

  emulator:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: gradle/actions/setup-gradle@v6
      - name: Derive release asset names in this job
        id: release_metadata
        env:
          BUILT_VERSION: ${{ needs.build.outputs.version }}
          BUILT_VERSION_CODE: ${{ needs.build.outputs.version_code }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:writeReleaseMetadata
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('app/build/release-metadata.json').read_text())
          assert metadata['version_name'] == os.environ['BUILT_VERSION'], 'Build and emulator versions must match'
          assert str(metadata['version_code']) == os.environ['BUILT_VERSION_CODE'], 'Build and emulator version codes must match'
          # Keep full public names within this job: GitHub may mask a matching
          # signing alias and suppress those names when exported across jobs.
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key in ('apk_name', 'artifact_name'):
                  output.write(f'{key}={metadata[key]}\n')
          PY
      - name: Prepare live application backend
        working-directory: .
        run: |
          npm ci
          npm run build
      - name: Start isolated live backend for Android pairing tests
        working-directory: .
        env:
          APP_STORAGE: local
          APP_DEVICE_BOOTSTRAP_KEY: test-only-device-bootstrap-key-2026
          APP_DB_PATH: ${{ runner.temp }}/android-test.sqlite
          AI_API_KEY: ''
          COOKIE_SECURE: 'false'
          APP_ORIGIN: ''
        run: |
          mkdir -p android/app/build/reports/backend
          # This is the same CLI as npm start, launched directly so the recorded
          # PID belongs to the server rather than an npm/shell wrapper.
          nohup node node_modules/next/dist/bin/next start --hostname 0.0.0.0 --port 3000 > android/app/build/reports/backend/server.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/android-web-server.pid"
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:3000/api/auth/session > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat android/app/build/reports/backend/server.log
          echo 'The isolated application backend did not become ready.' >&2
          exit 1
      - uses: actions/download-artifact@v6
        if: needs.build.outputs.signed == 'true'
        with:
          name: ${{ steps.release_metadata.outputs.artifact_name }}
          path: android/release
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          chmod +x gradlew
      - name: Verify signed APK, UI instrumentation, cold Doze alarms and reboot recovery
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808 # v2
        env:
          HAS_SIGNED_RELEASE: ${{ needs.build.outputs.signed }}
          RELEASE_APK_NAME: ${{ steps.release_metadata.outputs.apk_name }}
          EXPECTED_VERSION_NAME: ${{ needs.build.outputs.version }}
          EXPECTED_VERSION_CODE: ${{ needs.build.outputs.version_code }}
          TEST_DEVICE_BOOTSTRAP_KEY: test-only-device-bootstrap-key-2026
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-snapshot -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: bash ci/emulator-check.sh
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: android-emulator-reports
          path: |
            android/app/build/reports/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
      - name: Stop isolated test backend
        if: always()
        working-directory: .
        run: |
          if [ -f "$RUNNER_TEMP/android-web-server.pid" ]; then
            server_pid="$(cat "$RUNNER_TEMP/android-web-server.pid")"
            if [[ "$server_pid" =~ ^[0-9]+$ ]]; then
              kill "$server_pid" 2>/dev/null || true
            fi
          fi
